name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build
        run: dotnet build SimpleDecrypt.csproj --configuration Release

      - name: Create package
        id: package
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "SimpleDecrypt-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item "bin\Release\net48\SimpleDecrypt.exe" $package
          Copy-Item "README.md" $package
          $zip = Join-Path $env:RUNNER_TEMP "SimpleDecrypt-$env:GITHUB_REF_NAME-win.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDecrypt-${{ github.ref_name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip }}
