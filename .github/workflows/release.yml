name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore SimpleDecrypt.csproj

      - name: Build
        run: dotnet build SimpleDecrypt.csproj --configuration Release --no-restore

      - name: Package release
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $stage = Join-Path $env:GITHUB_WORKSPACE "release-stage"
          $zip = Join-Path $dist "SimpleDecrypt-$env:GITHUB_REF_NAME-win.zip"

          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "bin\Release\net48\SimpleDecrypt.exe" $stage
          Copy-Item "README.md" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force

          if (-not (Test-Path $zip)) {
            throw "Release package was not created: $zip"
          }

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SimpleDecrypt-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.zip
